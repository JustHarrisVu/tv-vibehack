name: Build TV Launcher
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cau hinh 4 app cho TV Skyworth
        run: |
          cat << 'EOF' > launcher/app/src/main/res/values/config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string-array name="dock_apps">
                  <item>com.google.android.youtube.tv</item>
                  <item>com.netflix.ninja</item>
                  <item>org.jellyfin.androidtv</item>
                  <item>com.google.android.youtube.tvmusic</item>
              </string-array>
              <string-array name="hidden_apps">
              </string-array>
              <string name="live_tv_package">com.smartdevice.livetv</string>
              <integer name="columns">6</integer>
          </resources>
          EOF
      - name: Build APK
        working-directory: ./launcher
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-vibehack-launcher
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
